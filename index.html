<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deniz'in LGS Çalışma Asistanı</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2333;--mu:#6b7285;--line:#dfe4f0;--pri:#3b4cca;--xp:#f5a524;--oks:#1d4ed8;--drs:#c026d3;--okh:#f97316;--drh:#15803d;--wk:#475569;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#e8ebf5;--mu:#9aa2b8;--line:#2b3247;--pri:#8b97ff}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#e8ebf5;--mu:#9aa2b8;--line:#2b3247;--pri:#8b97ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",Verdana,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:var(--pri);color:#fff}
header h1{font-size:1.15rem;margin:0}
#xp{background:var(--xp);color:#3a2600;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{margin:4px 0 12px;font-size:1.3rem}h3{margin:0 0 8px;font-size:1.05rem}h4{margin:10px 0 6px;color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mu,small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button.b{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
button.b{background:var(--pri);color:#fff;border-color:var(--pri);cursor:pointer;font-weight:700}
.sc-okul{--c:var(--oks)}.sc-dershane{--c:var(--drs)}.hw-okul{--c:var(--okh)}.hw-dershane{--c:var(--drh)}.wk{--c:var(--wk)}
.it,.ch{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card))}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:6px}
.it>div{flex:1}.it input{width:22px;height:22px;accent-color:var(--c)}
.it .x,.ph .x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:1.1rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sum div{text-align:center}.sum b{display:block;font-size:2rem;color:var(--xp)}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:20px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem}
.chart small{text-align:center;line-height:1.15;font-size:.68rem}.chart i{display:block;width:100%;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.scroll{overflow-x:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:700px}
.gh{text-align:center;font-weight:700;color:var(--mu)}
.day{min-height:96px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--card)}
.day.td{border:2px solid var(--pri)}.day>b{font-size:.85rem}
.ch{display:block;font-size:.72rem;padding:2px 4px;margin-top:2px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch input{margin:0 3px 0 0;vertical-align:middle;accent-color:var(--c)}
.bars{display:flex;gap:2px}.bar{flex:1;height:8px;border-radius:2px;background:var(--c)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.8rem}.lg span{padding:2px 8px;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.ch.sc-okul,.ch.sc-dershane,.it.sc-okul,.it.sc-dershane,.lg span.sc-okul,.lg span.sc-dershane{background:var(--c);color:#fff;border-left-color:#fff6}
.sc-okul small,.sc-dershane small{color:#fff}
.hw-okul,.hw-dershane{font-weight:600}.ch.hw-okul,.it.hw-okul,.lg span.hw-okul,.ch.hw-dershane,.it.hw-dershane,.lg span.hw-dershane{border-left-width:6px;background:color-mix(in srgb,var(--c) 28%,var(--card))}
.ch.wk,.it.wk,.lg span.wk{border-left-style:dashed;border:1px dashed var(--c);border-left-width:4px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{position:relative}.ph img{width:100%;height:150px;object-fit:cover;border-radius:8px;cursor:zoom-in}.ph .x{position:absolute;top:2px;right:2px;background:#0008;color:#fff;border-radius:50%;width:24px;height:24px;padding:0}
.wg{display:grid;grid-template-columns:64px repeat(7,minmax(120px,1fr));min-width:900px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.wg>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:2px 3px;min-height:30px}
.tdh{color:var(--pri)}.hr{font-size:.75rem;color:var(--mu);text-align:right}.hr.lb{font-weight:700;color:var(--ink);text-align:left}
.slot.big{min-height:80px}.wg .big{min-height:60px}.ch.w{white-space:normal}.ch[draggable=true]{cursor:grab}.ch .x{border:0;background:none;cursor:pointer;padding:0 2px;float:right}.dn{cursor:pointer;text-decoration:underline}#sy{font-size:.8rem;margin-left:auto}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#4f46e5,#06b6d4 70%,#22c55e);color:#fff;border-radius:18px;padding:20px;margin-bottom:12px}.hero .chip{background:#ffffff33;padding:4px 10px;border-radius:14px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}.stats .card{margin:0}.big{display:block;font-size:1.8rem;font-weight:800}
.hg{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.hg>.card{margin:0}.s6{grid-column:span 6}.s12{grid-column:span 12}@media(max-width:800px){.s6{grid-column:span 12}}
.pb{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f5a524,#f97316)}
.ring{flex:none;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}.ring b{background:var(--card);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.nrow{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:.9rem}
.bds{display:flex;flex-wrap:wrap;gap:10px}.bd{width:90px;text-align:center;font-size:2rem}.bd small{display:block;font-size:.7rem}.bd.off{filter:grayscale(1);opacity:.35}
.more{float:right;border:0;background:none;color:var(--pri);cursor:pointer;font:inherit}
.tb td,.tb th{padding:4px 8px;text-align:left}.tb input{width:90px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
@media(min-width:900px){body{display:grid;grid-template-columns:210px 1fr;align-items:start}header{grid-column:1/3}nav{flex-direction:column;position:sticky;top:0;height:calc(100vh - 60px);border-right:1px solid var(--line);border-bottom:0;overflow-y:auto}nav button{text-align:left;border-radius:12px}main{max-width:1250px;width:100%}}
.mascot{width:120px;height:120px;object-fit:cover;border-radius:20px;box-shadow:0 4px 14px #0004;flex:none}@media(max-width:600px){.mascot{width:84px;height:84px}}
.chart i.cur{background:linear-gradient(180deg,#f5a524,#f97316)}
.fwb{position:relative;overflow:hidden;margin-top:12px;padding:18px;min-height:150px;border-radius:14px;background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;text-align:center}.fwb canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.fwb>:not(canvas){position:relative}.fwb h3{color:#fff}.fwb .big{color:#ffd166}
.av{position:relative;flex:none}.av .mascot{display:block;cursor:pointer}.camb{position:absolute;right:-6px;bottom:-6px;border:0;background:#fff;color:#222;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;box-shadow:0 2px 6px #0005}.camb.rm{right:auto;left:-6px;font-size:.8rem}
.stk{margin:0;width:100%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}.stk:empty{background:var(--line)}.stk.cur{outline:2px solid #f97316}.stk em{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.62rem;color:#fff;font-weight:700;min-height:1px;overflow:hidden;text-shadow:0 0 3px #000a}
.lgq span{color:#fff!important;text-shadow:0 0 3px #0008;border-left:0!important}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:9;align-items:center;justify-content:center;padding:10px}#lb img{max-width:100%;max-height:100%}
.pill.on{background:var(--pri);color:#fff}
</style></head>
<body>
<header><h1>Deniz'in LGS Çalışma Asistanı</h1><div id="sy"></div><div id="xp"></div></header>
<nav id="nav"></nav><main id="app"></main><div id="lb"><img></div><div id="toast"></div>
<script>
const DERS={
"Türkçe":["Fiilimsiler","Cümlenin Öğeleri","Fiil Çatısı","Sözcükte Anlam","Cümlede Anlam","Cümle Çeşitleri","Yazım Kuralları","Paragraf","Noktalama İşaretleri","Anlatım Bozuklukları"],
"Matematik":["Çarpanlar Katlar","Üslü İfadeler","Kareköklü İfadeler","Veri Analizi","Basit Olayların Olma Olasılığı","Cebirsel İfadeler ve Özdeşlikler","Doğrusal Denklemler","Eşitsizlikler","Üçgenler","Eşlik ve Benzerlik","Dönüşüm Geometrisi","Geometrik Cisimler"],
"Fen Bilimleri":["Mevsimler ve İklim","DNA ve Genetik Kod","Basınç","Madde ve Endüstri","Basit Makineler","Enerji Dönüşümleri ve Çevre Bilimi","Elektrik Yükleri ve Elektrik Enerjisi"],
"İnkılap Tarihi":["Bir Kahraman Doğuyor","Milli Uyanış-Bağımsızlık Yolunda Atılan Adımlar","Milli Bir Destan-Ya İstiklal Ya Ölüm","Atatürkçülük ve Çağdaşlaşan Türkiye","Demokratikleşme Çabaları","Atatürk Dönemi Türk Dış Politikası","Atatürk'ün Ölümü ve Sonrası"],
"İngilizce":["Friendship","Teen Life","In The Kitchen","On The Phone","The Internet","Adventures","Tourism","Chores","Science","Natural Forces"],
"Din Kültürü":["Kader İnancı","Zekat ve Sadaka","Din ve Hayat","Hz. Muhammed'in Örnekliği","Kur'an-ı Kerim ve Özellikleri"]};
const EXTRA=['Rehberlik','Resim','Beden Eğitimi','Müzik','Çevre','Görgü Kuralları','Teknoloji Tasarım'],ALL=()=>[...Object.keys(DERS),...EXTRA];
const GS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'],GUN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'],AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MENU=[['ana','🏠 Ana Sayfa'],['bugun','📅 Bugün'],['puan','⭐ Puanlarım'],['takvim','🗓️ Takvimim'],['odev','📘 Ödevler'],['calisma','✏️ Çalışmalarım'],['eksik','⚠️ Eksikler'],['yanlis','❌ Yanlışlarım'],['not','📚 Notlarım'],['soru','📝 Soru Sayım'],['sinav','🎯 Deneme Sınavlarım'],['sdt','📆 Sınav Tarihlerim'],['ayar','⚙️ Ayarlar']];
const DEF=()=>({sched:[],hw:[],work:[],wrong:[],notes:[],qs:[],exams:[],sd:[],avatar:'',lgs:'',goal:300,name:'Deniz',id:1});let S=DEF(),view='ana',mon=new Date(),flt='all',wf={d:'',k:''},DB=null,cal='hafta',GH=null,sync='',examT='genel',qmon=null,fwDone=false;
const $=s=>document.querySelector(s),v=id=>$('#'+id).value;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),fd=s=>s.split('-').reverse().join('.'),dow=d=>(d.getDay()+6)%7;
const mondayOf=d=>{const x=new Date(d);x.setDate(x.getDate()-dow(x));return x};let ws=mondayOf(new Date());
const dO=x=>Object.keys(DERS).map(d=>`<option ${d==x?'selected':''}>${d}</option>`).join('');
const kO=(d,x)=>(DERS[d]||[]).map(k=>`<option ${k==x?'selected':''}>${esc(k)}</option>`).join('')||'<option value="">Konu yok</option>';
const dk=p=>`<select id="${p}d">${dO()}</select><select id="${p}k">${kO(Object.keys(DERS)[0])}</select>`;
const tO=`<option value="okul">Okul</option><option value="dershane">Dershane</option>`;
function migrate(){const O='Fen ve '+'Teknoloji';['sched','hw','work','wrong','notes','qs','sd'].forEach(k=>(S[k]||[]).forEach(x=>{if(x.ders==O)x.ders='Fen Bilimleri'}));(S.exams||[]).forEach(e=>{if(e.r&&e.r[O]){e.r['Fen Bilimleri']=e.r[O];delete e.r[O]}})}
const idb=(m,k,val)=>new Promise(r=>{try{const o=DB.transaction('s',m=='r'?'readonly':'readwrite').objectStore('s'),q=m=='r'?o.get(k):o.put(val,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const setSync=t=>{sync=t;const e=$('#sy');if(e)e.textContent=t};
async function load(){try{DB=await new Promise((r,j)=>{const q=indexedDB.open('deniz-lgs',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=j});
const st=await idb('r','state');if(st){S=Object.assign(S,st);migrate()}GH=(await idb('r','gh'))||null}catch(e){}
if(GH)await pull()}
let tm;function save(){idb('w','state',S);if(GH){clearTimeout(tm);setSync('⏳ Kaydediliyor');tm=setTimeout(push,2000)}}
const api=(p,o={})=>fetch(`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${p}`+(o.method?'':'?ref='+GH.b),{...o,headers:{Authorization:'Bearer '+GH.t,Accept:'application/vnd.github+json'}});
const b64=x=>btoa(unescape(encodeURIComponent(x))),unb=x=>decodeURIComponent(escape(atob(x.replace(/\n/g,''))));
async function put(p,content,msg){let sha;const g=await api(p);if(g.ok)sha=(await g.json()).sha;const r=await api(p,{method:'PUT',body:JSON.stringify({message:msg,content,branch:GH.b,sha})});if(!r.ok)throw new Error(r.status)}
async function push(){try{for(const w of S.wrong)if(w.img&&!w.up){await put('fotolar/'+w.id+'.jpg',w.img.split(',')[1],'Yanlış soru fotoğrafı');w.up=1}
await put('data.json',b64(JSON.stringify({...S,wrong:S.wrong.map(({img,...x})=>x)})),'Deniz LGS verileri');idb('w','state',S);setSync('☁️ GitHub\'a kaydedildi')}catch(e){setSync('⚠️ GitHub hatası')}}
async function pull(){try{setSync('⏳ GitHub okunuyor');const g=await api('data.json');
if(g.ok){const D=JSON.parse(unb((await g.json()).content)),old=Object.fromEntries(S.wrong.map(w=>[w.id,w.img]));(D.wrong=D.wrong||[]).forEach(w=>w.img=old[w.id]||null);S=Object.assign(DEF(),D);migrate();
for(const w of S.wrong)if(!w.img){const r=await api('fotolar/'+w.id+'.jpg');if(r.ok)w.img='data:image/jpeg;base64,'+(await r.json()).content.replace(/\n/g,'')}
idb('w','state',S);setSync('☁️ GitHub ile güncel')}else if(g.status==404){await push()}else throw 0}catch(e){setSync('⚠️ GitHub hatası')}}
const dn=()=>[...S.hw,...S.work].filter(x=>x.done&&x.dd);
const xpIn=f=>dn().filter(x=>f(x.dd)).length*10;
const wk0=()=>{const d=new Date();d.setDate(d.getDate()-dow(d));return ymd(d)};
const chk=(t,x)=>`<input type="checkbox" data-t="${t}" data-id="${x.id}" ${x.done?'checked':''}>`;
const del=(t,x)=>`<button class="x" data-act="del" data-t="${t}" data-id="${x.id}" title="Sil">✕</button>`;
const hwL=h=>`<div class="it hw-${h.type}">${chk('hw',h)}<div><b>${esc(h.ders)}</b> ${esc(h.konu)} ${esc(h.desc)}<br><small>${h.type=='okul'?'Okul':'Dershane'} ödevi · Son gün: ${fd(h.due)}</small></div>${del('hw',h)}</div>`;
const wL=w=>`<div class="it wk">${chk('work',w)}<div><b>${esc(w.ders)}</b> · ${esc(w.konu)}<br><small>${w.q} soru · ${w.min} dk · ${fd(w.date)}</small></div>${del('work',w)}</div>`;
const hwT=h=>esc((h.type=='okul'?'Okul':'Dershane')+' ödevi\n'+h.ders+(h.konu?' – '+h.konu:'')+'\n'+(h.desc||'')+'\nSon tarih: '+fd(h.due));
const scT=x=>esc((x.type=='okul'?'Okul':'Dershane')+' dersi\n'+x.time+' '+x.ders);
const hwOn=ds=>S.hw.filter(h=>h.cr<=ds&&ds<=h.due&&(!h.done||h.due==ds));
const plb=(t,x,ds)=>cal=='hafta'?`<button type="button" class="x" data-act="plc" data-t="${t}" data-id="${x.id}" data-n="${ds}" title="Saat seç">🕘</button>`:'';
const plH=(x,ds)=>x.pl?x.pl[ds]:null;
const hwC=(h,ds)=>`<label class="ch w hw-${h.type}" draggable="true" data-dt="hw" data-id="${h.id}" data-ds="${ds}" title="${hwT(h)}">${plb('hw',h,ds)}${chk('hw',h)}${h.due==ds?'📌 Son gün · ':''}${h.type=='okul'?'Okul':'Dershane'} · ${esc(h.ders)} ${esc(h.desc)}</label>`;

const sdL=e=>{const k=gunK(e.date);return `<div class="it" style="--c:${k<0?'var(--mu)':k<=3?'#dc2626':'var(--pri)'}"><div><b>${esc(e.ders)}</b> · ${esc(e.tur)}${e.time?' · '+e.time:''}<br><small>${fd(e.date)}${e.not?' · '+esc(e.not):''}</small></div><b>${k<0?'':k==0?'Bugün!':k==1?'Yarın':k+' gün'}</b>${del('sd',e)}</div>`};
const r2=x=>Math.round(x*100)/100,netOf=(d,y)=>r2((+d||0)-(+y||0)/3);
const SAY=['Matematik','Fen Bilimleri'],SOZ=['Türkçe','İnkılap Tarihi','Din Kültürü','İngilizce'],QN={'Türkçe':20,'Matematik':20,'Fen Bilimleri':20,'İnkılap Tarihi':10,'İngilizce':10,'Din Kültürü':10},TUR={genel:'Genel Deneme',sayisal:'Branş – Sayısal',sozel:'Branş – Sözel'};
const exSet=t=>t=='sayisal'?SAY:t=='sozel'?SOZ:[...SAY,...SOZ];
const exNet=(e,set)=>r2(Object.entries(e.r).filter(([k])=>set.includes(k)).reduce((a,[k,x])=>a+netOf(x.d,x.y),0));
const lvl=()=>{const x=dn().length*10;return[Math.floor(x/100)+1,x%100,x]};
const streak=()=>{const ds=new Set(dn().map(x=>x.dd));let n=0,d=new Date();if(!ds.has(ymd(d)))d.setDate(d.getDate()-1);while(ds.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n};
const wsOf=ds=>ymd(mondayOf(new Date(ds+'T00:00')));
const qWeeks=n=>{const o=[],m=mondayOf(new Date());for(let i=n-1;i>=0;i--){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()-7*i),k=ymd(d);o.push([AY[d.getMonth()]+'<br>'+Math.ceil(d.getDate()/7)+'. hafta',S.qs.filter(q=>wsOf(q.date)==k).reduce((a,q)=>a+q.n,0)])}return o};
const qDays=n=>{const o=[],t=new Date();for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i),k=ymd(d);o.push([GS[dow(d)]+'<br>'+d.getDate()+' '+AY[d.getMonth()].slice(0,3),S.qs.filter(q=>q.date==k).reduce((a,q)=>a+q.n,0)])}return o};
const qDef=()=>{const k=today().slice(0,7);return k<'2026-08'?'2026-08':k>'2027-06'?'2027-06':k};
const DC={'Türkçe':'#ef4444','Matematik':'#2563eb','Fen Bilimleri':'#16a34a','İnkılap Tarihi':'#d97706','İngilizce':'#8b5cf6','Din Kültürü':'#0891b2','Paragraf':'#db2777'};
const qSum=f=>{const o={};S.qs.filter(f).forEach(q=>o[q.ders]=(o[q.ders]||0)+q.n);return o},tt=b=>Object.values(b).reduce((a,x)=>a+x,0);
const stackC=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return `<div class="chart">${a.map(x=>`<div><span>${x[1]}</span><p class="stk${x[2]?' cur':''}" style="height:${x[1]/mx*130}px">${Object.entries(x[3]).filter(e=>e[1]>0).map(([d,n])=>`<em style="flex:${n};background:${DC[d]||'#64748b'}" title="${esc(d)}: ${n} soru">${n/mx*130>=13?n:''}</em>`).join('')}</p><small>${x[0]}</small></div>`).join('')}</div>`};
const LGq=()=>`<div class="lg lgq">${Object.entries(DC).map(([d,c])=>`<span style="background:${c}">${d}</span>`).join('')}</div><small class="mu">Sütunun üstündeki sayı toplam soru, renkli bölümlerdeki sayılar derslere göre soru sayısıdır. Üzerine gelince ders adı görünür.</small>`;
const qDaysM=ym=>{const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),t=today(),o=[];for(let i=1;i<=n;i++){const k=ym+'-'+pad(i);const b=qSum(q=>q.date==k);o.push([GS[dow(new Date(y,m-1,i))]+'<br>'+i,tt(b),k==t,b])}return o};
const qMonths=()=>{const o=[],c=today().slice(0,7);for(let i=0;i<11;i++){const d=new Date(2026,7+i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1);const b=qSum(q=>q.date.startsWith(k));o.push([AY[d.getMonth()]+'<br>'+d.getFullYear(),tt(b),k==c,b])}return o};
const qWeeksR=()=>{const o=[],cur=wsOf(today()),end=new Date(2027,5,30);let d=new Date(2026,7,3);while(d<=end){const k=ymd(d);const b=qSum(q=>wsOf(q.date)==k);o.push([AY[d.getMonth()]+'<br>'+Math.ceil(d.getDate()/7)+'. hafta',tt(b),k==cur,b]);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7)}return o};
function fw(){const c=$('#fw');if(!c||c.dataset.go!='1'||fwDone||matchMedia('(prefers-reduced-motion: reduce)').matches)return;fwDone=true;
const x=c.getContext('2d'),W=c.width=c.offsetWidth,H=c.height=c.offsetHeight,P=[],t0=performance.now();let last=-999;
const burst=()=>{const cx=W*(.15+Math.random()*.7),cy=H*(.2+Math.random()*.4),h=Math.random()*360;for(let i=0;i<60;i++){const a=Math.PI*2*i/60,v=1.5+Math.random()*2.5;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+Math.random()*40})}};
const f=t=>{const el=t-t0;if(el<3500&&el-last>450){burst();last=el}x.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.99;p.l-=.012;if(p.l>0){x.fillStyle='hsla('+p.h+',100%,60%,'+p.l+')';x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}}
for(let i=P.length-1;i>=0;i--)if(P[i].l<=0)P.splice(i,1);if(el<3500||P.length)requestAnimationFrame(f);else x.clearRect(0,0,W,H)};requestAnimationFrame(f)}
const barC=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return `<div class="chart">${a.map(x=>`<div><span>${x[1]}</span><i style="height:${x[1]/mx*130}px"${x[2]?' class="cur"':''}></i><small>${x[0]}</small></div>`).join('')}</div>`};
const lineC=(lb,ser,lo,hi)=>{if(!lb.length)return none('Henüz sınav girilmedi.');const W=420,H=170,p=28,all=ser.flatMap(s=>s.v),mx=hi??Math.max(10,...all),mn=lo??Math.min(0,...all),x=i=>p+(lb.length>1?i*(W-2*p)/(lb.length-1):(W-2*p)/2),y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
return `<svg viewBox="0 0 ${W} ${H}" width="100%"><g style="stroke:var(--line)">${[0,.5,1].map(t=>`<line x1="${p}" x2="${W-p}" y1="${y(mn+t*(mx-mn))}" y2="${y(mn+t*(mx-mn))}"/>`).join('')}</g>${ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="3" points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}"><title>${s.n}: ${v}</title></circle>`).join('')}`).join('')}${lb.map((l,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" style="fill:var(--mu)">${l}</text>`).join('')}<text x="2" y="${y(mx)+4}" font-size="10" style="fill:var(--mu)">${mx}</text><text x="2" y="${y(mn)+4}" font-size="10" style="fill:var(--mu)">${mn}</text></svg><div class="lg">${ser.map(s=>`<span style="--c:${s.c};background:color-mix(in srgb,${s.c} 22%,var(--card))">${s.n}</span>`).join('')}</div>`};

<div class="card"><h3>Ders programı</h3>${sc.map(s=>`<div class="it sc-${s.type}"><div>${s.time} ${esc(s.ders)} <small>${s.type=='okul'?'Okul':'Dershane'}</small></div></div>`).join('')||none('Bugün için ders programı girilmemiş. Takvimim bölümünden ekleyebilirsin.')}</div>
<div class="card"><h3>Bugün yapılması gereken ödevler</h3>${hw.map(hwL).join('')||none('Bugün için ödev yok.')}</div>
<div class="card"><h3>Bugünkü çalışmalar</h3>${wk.map(wL).join('')||none('Bugün için çalışma planı yok. Çalışmalarım bölümünden ekle.')}</div>
<div class="card"><h3>Tamamlanan ödevler (${hd.length})</h3>${hd.map(hwL).join('')||none('Bugün henüz ödev tamamlanmadı.')}</div>
<div class="card"><h3>Tamamlanan çalışmalar (${wd.length})</h3>${wd.map(wL).join('')||none('Bugün henüz çalışma tamamlanmadı.')}</div>`},
puan(){const d=new Date(),mk=d.getFullYear()+'-'+pad(d.getMonth()+1),tot=dn().length*10;
const vals=[];for(let i=11;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1),k=m.getFullYear()+'-'+pad(m.getMonth()+1);vals.push([AY[m.getMonth()].slice(0,3),xpIn(s=>s.startsWith(k))])}
const mx=Math.max(20,...vals.map(a=>a[1]));
return `<h2>Puanlarım</h2><div class="card sum"><div><b>${xpIn(s=>s==today())}</b>Bugün</div><div><b>${xpIn(s=>s>=wk0())}</b>Bu hafta</div><div><b>${xpIn(s=>s.startsWith(mk))}</b>Bu ay</div><div><b>${tot}</b>Toplam XP</div></div>
<div class="card"><h3>Aylık puanlar</h3><div class="chart">${vals.map(a=>`<div><span>${a[1]}</span><i style="height:${a[1]/mx*130}px"></i><small>${a[0]}</small></div>`).join('')}</div></div>`},
takvim(){return `<h2>Takvimim</h2><div class="row" style="margin-bottom:10px">${['hafta','ay'].map(k=>`<button class="b" style="${cal==k?'':'background:var(--card);color:var(--ink)'}" data-act="cal" data-n="${k}">${k=='ay'?'Aylık':'Haftalık (08:00–00:00)'}</button>`).join('')}</div>${cal=='ay'?V.ay():V.hafta()}${PF()}`},
hafta(){const t=today(),days=[...Array(7)].map((_,i)=>{const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i);return[d,ymd(d)]}),hrOf=x=>{const h=+x.time.slice(0,2);return h==0?24:h<8?8:h};
let g='<div class="gh"></div>'+days.map(([d,ds])=>`<div class="gh ${ds==t?'tdh':''}">${GS[dow(d)]} ${d.getDate()}.${pad(d.getMonth()+1)}</div>`).join('');
for(let h=8;h<=24;h++)g+=`<div class="hr">${pad(h%24)}:00</div>`+days.map(([d,ds],i)=>`<div class="slot" data-ds="${ds}" data-h="${h}">${S.sched.filter(x=>x.day==i&&hrOf(x)==h).map(x=>`<div class="ch w sc-${x.type}" title="${scT(x)}">${x.time} ${esc(x.ders)}</div>`).join('')}${hwOn(ds).filter(x=>!x.done&&plH(x,ds)==h).map(x=>hwC(x,ds)).join('')}${S.work.filter(w=>!w.done&&w.date==ds&&plH(w,ds)==h).map(wC).join('')}</div>`).join('');
g+='<div class="hr lb">Ödevlerim</div>'+days.map(([d,ds])=>`<div class="slot big" data-ds="${ds}" data-h="x">${hwOn(ds).filter(h=>!h.done&&plH(h,ds)==null).map(h=>hwC(h,ds)).join('')}</div>`).join('');
g+='<div class="hr lb">Çalışmalarım</div>'+days.map(([d,ds])=>`<div class="slot big" data-ds="${ds}" data-h="x">${S.work.filter(w=>!w.done&&w.date==ds&&plH(w,ds)==null).map(wC).join('')}</div>`).join('');
const ndr=x=>x.replace('draggable="true"','').replace(/<button[^>]*data-act="plc"[^>]*>.*?<\/button>/,'');
g+='<div class="hr lb">Tamamlanan ödevlerim</div>'+days.map(([d,ds])=>`<div class="big">${S.hw.filter(h=>h.done&&h.dd==ds).map(h=>ndr(hwC(h,''))).join('')}</div>`).join('');
g+='<div class="hr lb">Tamamlanan çalışmalarım</div>'+days.map(([d,ds])=>`<div class="big">${S.work.filter(w=>w.done&&w.dd==ds).map(w=>ndr(wC(w))).join('')}</div>`).join('');
return `<div class="card row" style="justify-content:space-between"><button class="b" data-act="wn" data-n="-1">‹</button><h3 style="margin:0">${fd(days[0][1])} – ${fd(days[6][1])}</h3><button class="b" data-act="wn" data-n="1">›</button></div><div class="card scroll"><div class="wg">${g}</div>${LG}<p class="mu">Ödevin üzerine gelince ayrıntısını görürsün. Tamamlanan ödev ve çalışmalar tiklendiği günün altındaki "Tamamlanan" satırlarına geçer. Ödev ya da çalışmayı sürükleyip o günün istediğin saatine bırakabilirsin (geri almak için alttaki satıra bırak; dokunmatik ekranda 🕘 düğmesiyle saat seç). Ödev, son gününe kadar her gün "Ödevlerim" satırında görünür.</p></div>`},
ay(){const y=mon.getFullYear(),m=mon.getMonth(),n=new Date(y,m+1,0).getDate(),off=dow(new Date(y,m,1)),t=today();
let c=GS.map(g=>`<div class="gh">${g}</div>`).join('')+'<div></div>'.repeat(off);
for(let i=1;i<=n;i++){const ds=`${y}-${pad(m+1)}-${pad(i)}`,wd=(off+i-1)%7;
const sc=S.sched.filter(s=>s.day==wd).sort((a,b)=>a.time>b.time?1:-1).map(s=>`<div class="ch sc-${s.type}" title="${scT(s)}">${s.time} ${esc(s.ders)}</div>`).join('');
const hw=S.hw.filter(h=>h.due==ds).map(h=>hwC(h,ds)).join('');
const wk=S.work.filter(w=>w.date==ds).map(wC).join('');
const bars=hwOn(ds).filter(h=>!h.done).map(h=>`<span class="bar hw-${h.type}" title="${hwT(h)}"></span>`).join('');
c+=`<div class="day ${ds==t?'td':''}"><b class="dn" data-act="wk" data-n="${ds}" title="Haftalık görünümde aç">${i}</b><div class="bars">${bars}</div>${sc}${hw}${wk}</div>`}
return `<div class="card"><div class="row" style="justify-content:space-between"><button class="b" data-act="mo" data-n="-1">‹</button><h3 style="margin:0">${AY[m]} ${y}</h3><button class="b" data-act="mo" data-n="1">›</button></div></div>
<div class="card scroll"><div class="cal">${c}</div><div class="lg"><span class="sc-okul">Okul dersi</span><span class="sc-dershane">Dershane dersi</span><span class="hw-okul">Okul ödevi (📌 son gün)</span><span class="hw-dershane">Dershane ödevi</span><span class="wk">Çalışma</span></div></div>
`},
odev(){const f=S.hw.filter(h=>flt=='all'||h.type==flt).sort((a,b)=>a.due>b.due?1:-1);
const sec=(t,l)=>`<div class="card"><h3>${t} (${l.length})</h3>${['okul','dershane'].map(ty=>{const x=l.filter(h=>h.type==ty);return x.length?`<h4>${ty=='okul'?'Okul':'Dershane'} ödevleri</h4>`+x.map(hwL).join(''):''}).join('')||none('Burada ödev yok.')}</div>`;
return `<h2>Ödevler</h2><div class="card"><h3>Yeni ödev</h3><div class="row"><select id="hwt">${tO}</select><select id="hwd">${ALL().map(d=>`<option>${d}</option>`).join('')}</select><select id="hwk">${kO(Object.keys(DERS)[0])}</select><input id="hwx" placeholder="Açıklama (ör. s.45 test)"><label>Son tarih <input id="hwdue" type="date"></label><button class="b" data-act="addhw">Ödevi ekle</button></div></div>
<div class="row" style="margin-bottom:10px">${[['all','Tümü'],['okul','Okul'],['dershane','Dershane']].map(a=>`<button class="b ${flt==a[0]?'':'pill'}" style="${flt==a[0]?'':'background:var(--card);color:var(--ink)'}" data-act="flt" data-n="${a[0]}">${a[1]}</button>`).join('')}</div>
${sec('Tamamlanmayan ödevler',f.filter(h=>!h.done))}${sec('Tamamlanan ödevler',f.filter(h=>h.done))}`},
calisma(){return `<h2>Çalışmalarım</h2><div class="card"><h3>Yeni çalışma</h3><div class="row"><input id="wdt" type="date" value="${today()}">${dk('w')}<label>Soru <input id="wq" type="number" min="1" value="20" style="width:80px"></label><label>Süre (dk) <input id="wm" type="number" min="1" value="30" style="width:80px"></label><button class="b" data-act="addw">Çalışmayı ekle</button></div></div>
<div class="card">${S.work.slice().sort((a,b)=>a.date<b.date?1:-1).map(wL).join('')||none('Henüz çalışma yok.')}</div>`},
eksik(){const t=today(),h=S.hw.filter(x=>!x.done&&x.due<t),w=S.work.filter(x=>!x.done&&x.date<t);
return `<h2>Eksikler</h2><div class="card"><h3>Tamamlanmamış ödevler (${h.length})</h3>${h.map(hwL).join('')||none('Eksik ödev yok, harika!')}</div><div class="card"><h3>Tamamlanmamış çalışmalar (${w.length})</h3>${w.map(wL).join('')||none('Eksik çalışma yok, harika!')}</div>`},
ayar(){const g=GH||{};return `<h2>Ayarlar</h2><div class="card"><h3>Profil</h3><div class="row"><input id="pn" value="${esc(S.name)}" placeholder="Adın"><label>LGS tarihi <input id="pl" type="date" value="${S.lgs||''}"></label><button class="b" data-act="savep">Kaydet</button></div></div><div class="card"><h3>GitHub'a kaydetme</h3><p class="mu">Veriler depoda <b>data.json</b> olarak, yanlış soru fotoğrafları <b>fotolar/</b> klasöründe saklanır. Bağlanınca depoda veri varsa o yüklenir. Jeton (token) yalnızca bu tarayıcıda durur. Verileri sayfanın durduğu depodan ayrı, <b>özel (private)</b> bir depoda tut. Jeton: GitHub → Settings → Developer settings → Fine-grained tokens → sadece bu depo, Contents: Read and write.</p><div class="row"><input id="gho" placeholder="Kullanıcı adı" value="${esc(g.o)}"><input id="ghr" placeholder="Depo adı" value="${esc(g.r)}"><input id="ghb" placeholder="Dal" value="${esc(g.b||'main')}"><input id="ght" type="password" placeholder="Jeton" value="${esc(g.t)}"><button class="b" data-act="ghsave">Bağlan ve kaydet</button><button class="b" data-act="ghoff" style="background:var(--mu)">Bağlantıyı kaldır</button></div><p>${esc(sync)||'Bağlı değil: veriler yalnızca bu tarayıcıda.'}</p></div>`},
yanlis(){const l=S.wrong.filter(w=>(!wf.d||w.ders==wf.d)&&(!wf.k||w.konu==wf.k));
const g=Object.keys(DERS).map(d=>{const a=l.filter(w=>w.ders==d);if(!a.length)return'';return `<div class="card"><h3>${d}</h3>`+[...new Set(a.map(w=>w.konu))].map(k=>`<h4>${esc(k)}</h4><div class="imgs">`+a.filter(w=>w.konu==k).map(w=>`<div class="ph"><img src="${w.img||''}" data-act="zoom"><small>${esc(w.not)}</small>${del('wrong',w)}</div>`).join('')+'</div>').join('')+'</div>'}).join('');
return `<h2>Yanlışlarım</h2><div class="card"><h3>Yanlış soru ekle</h3><div class="row">${dk('y')}<input id="yn" placeholder="Not (isteğe bağlı)"><input id="yf" type="file" accept="image/*" multiple><button class="b" data-act="addy">Fotoğrafı kaydet</button></div></div>
<div class="card row"><b>Filtre:</b><select id="fd"><option value="">Tüm dersler</option>${dO(wf.d)}</select><select id="fk"><option value="">Tüm konular</option>${wf.d?kO(wf.d,wf.k):''}</select><button class="b" data-act="wdoc">📄 Word olarak indir</button></div>${g||none('Gösterilecek yanlış soru yok.')}`}};
function render(){$('#nav').innerHTML=MENU.map(m=>`<button class="${m[0]==view?'on':''}" data-act="go" data-n="${m[0]}">${m[1]}</button>`).join('');$('#app').innerHTML=V[view]();$('#xp').textContent='⭐ '+dn().length*10+' XP';setSync(sync);if(view=='soru'){document.querySelectorAll('#app .scroll').forEach(sc=>{const i=sc.querySelector('i.cur,.stk.cur');if(i)sc.scrollLeft=Math.max(0,i.getBoundingClientRect().left-sc.getBoundingClientRect().left+sc.scrollLeft-100)});fw()}}
const rd=f=>new Promise(r=>{const o=new FileReader();o.onload=()=>r(o.result);o.readAsDataURL(f)});
const sq=f=>new Promise(async r=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*.2,m,m,0,0,320,320);r(c.toDataURL('image/jpeg',.85))};im.src=await rd(f)});
const comp=async f=>new Promise(async r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=await rd(f)});
document.addEventListener('change',async e=>{const t=e.target,m=t.id&&t.id.match(/^(hw|w|y)d$/);
if(t.id=='hwt'){const d=$('#hwd'),c=d.value;d.innerHTML=(t.value=='okul'?ALL():Object.keys(DERS)).map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('');$('#hwk').innerHTML=kO(d.value);return}
if(m){$('#'+m[1]+'k').innerHTML=kO(t.value);return}
if(t.id=='avf'){const fl=t.files[0];if(!fl)return;S.avatar=await sq(fl);save();render();toast('Fotoğrafın eklendi 📸');return}if(t.id=='qm'){qmon=t.value;render();return}if(t.id=='et'){examT=t.value;render();return}if(t.id=='fd'){wf={d:t.value,k:''};render();return}if(t.id=='fk'){wf.k=t.value;render();return}
if(t.dataset.t){const L=lvl()[0],x=S[t.dataset.t].find(o=>o.id==t.dataset.id);x.done=t.checked;x.dd=t.checked?today():null;save();render();if(t.checked)toast(lvl()[0]>L?'🎊 Seviye atladın!':'+10 XP kazandın! 🎉')}});
function place(t,id,ds,h){const x=S[t].find(o=>o.id==id);x.pl=x.pl||{};if(h=='x')delete x.pl[ds];else x.pl[ds]=+h;save();render()}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-dt]');if(c)e.dataTransfer.setData('text/plain',[c.dataset.dt,c.dataset.id,c.dataset.ds].join('|'))});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
document.addEventListener('drop',e=>{const sl=e.target.closest&&e.target.closest('.slot');if(!sl)return;e.preventDefault();const[t,id,ds]=e.dataTransfer.getData('text/plain').split('|');if(!t)return;if(sl.dataset.ds!=ds){alert('Ödev ya da çalışma yalnızca kendi gününe yerleştirilebilir.');return}place(t,id,ds,sl.dataset.h)});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,n=b.dataset.n;
if(a=='plc'){const r=prompt('Saat kaç? (8-23 arası, 00:00 için 24; kaldırmak için boş bırak)');if(r===null)return;place(b.dataset.t,b.dataset.id,n,r.trim()===''?'x':Math.min(24,Math.max(8,+r||8)));return}else if(a=='wdoc'){await wdoc();return}
else if(a=='avp'){$('#avf').click();return}else if(a=='avx'){S.avatar='';save()}
else if(a=='addsd'){if(!v('xd')){alert('Sınav tarihini seç.');return}S.sd.push({id:S.id++,date:v('xd'),time:v('xh'),ders:v('xk'),tur:v('xt'),not:v('xn').trim()});save()}
else if(a=='addn'){const p=+v('np');if(!v('np')||p<0||p>100){alert('Puanı 0-100 arasında gir.');return}S.notes.push({id:S.id++,date:v('nd'),ders:v('nk'),tur:v('nt'),puan:p});save()}
else if(a=='addq'){const k=+v('qn');if(!(k>0))return;S.qs.push({id:S.id++,date:v('qd'),ders:v('qk'),n:k});save()}
else if(a=='savegoal'){S.goal=+v('gl')||300;save()}
else if(a=='savep'){S.name=v('pn').trim()||'Deniz';S.lgs=v('pl');save()}
else if(a=='addex'){const r={};exSet(examT).forEach((k,i)=>r[k]={q:+v('q'+i)||0,d:+v('d'+i)||0,y:+v('y'+i)||0});for(const k in r)if(r[k].d+r[k].y>r[k].q){alert(k+': doğru + yanlış, soru sayısını aşıyor.');return}let pu;if(examT=='genel'){pu=parseFloat(v('ep'));if(!(pu>=100&&pu<=500)){alert('Genel deneme için puanı 100-500 arasında gir.');return}}S.exams.push({id:S.id++,date:v('ed'),tur:examT,name:v('en').trim(),r,puan:pu});save()}
else if(a=='go'){view=n;fwDone=false;if(n=='takvim'){cal='hafta';ws=mondayOf(new Date())}}else if(a=='cal'){cal=n}else if(a=='wn'){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7*n)}else if(a=='wk'){cal='hafta';ws=mondayOf(new Date(n+'T00:00'))}else if(a=='ghsave'){GH={o:v('gho').trim(),r:v('ghr').trim(),b:v('ghb').trim()||'main',t:v('ght').trim()};await idb('w','gh',GH);await pull()}else if(a=='ghoff'){GH=null;await idb('w','gh',null);setSync('')}else if(a=='mo'){mon=new Date(mon.getFullYear(),mon.getMonth()+ +n,1)}else if(a=='flt'){flt=n}
else if(a=='zoom'){$('#lb img').src=b.src;$('#lb').style.display='flex';return}
else if(a=='del'){if(!confirm('Silinsin mi?'))return;const t=b.dataset.t;S[t]=S[t].filter(o=>o.id!=b.dataset.id);save()}
else if(a=='addsc'){if(!v('scd').trim())return;S.sched.push({id:S.id++,day:+v('scg'),time:v('sct'),ders:v('scd').trim(),type:v('scy')});save()}
else if(a=='addhw'){if(!v('hwdue')){alert('Son tarihi seç.');return}S.hw.push({id:S.id++,type:v('hwt'),ders:v('hwd'),konu:v('hwk'),desc:v('hwx'),due:v('hwdue'),cr:v('hwdue')<today()?v('hwdue'):today(),done:false,dd:null});save()}
else if(a=='addw'){if(!v('wdt'))return;S.work.push({id:S.id++,date:v('wdt'),ders:v('wd'),konu:v('wk'),q:+v('wq')||0,min:+v('wm')||0,done:false,dd:null});save()}
else if(a=='addy'){const fs=[...$('#yf').files];if(!fs.length){alert('Önce fotoğraf seç.');return}for(const f of fs)S.wrong.push({id:S.id++,ders:v('yd'),konu:v('yk'),not:v('yn'),img:await comp(f)});save()}
render()});
$('#lb').onclick=()=>$('#lb').style.display='none';
load().then(render);
</script></body></html>
