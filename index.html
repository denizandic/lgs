async function put(p,content,msg,to){
  for(let n=0;n<2;n++){
    let g;
    try{g=await api(p)}catch(e){throw new Error(e.name==='AbortError'?'GitHub zaman aşımı':'GitHub bağlantı hatası')}
    let sha;
    if(g.ok)sha=(await g.json()).sha;
    else if(g.status!==404)throw new Error('GET '+p+' HTTP '+g.status);
    let r;
    try{r=await api(p,{method:'PUT',to,body:JSON.stringify({message:msg,content,branch:GH.b,...(sha?{sha}:{})})})}catch(e){throw new Error(e.name==='AbortError'?'GitHub zaman aşımı':'GitHub bağlantı hatası')}
    if(r.ok)return await r.json();
    if(r.status===409&&n===0){await new Promise(res=>setTimeout(res,250));continue}
    let detail='';try{detail=await r.text()}catch(_){}
    throw new Error('PUT '+p+' HTTP '+r.status+(detail?' '+detail.slice(0,180):''));
  }
}

async function push(){
  if(!GH)return;
  if(pushBusy){pushAgain=true;return}
  pushBusy=true;
  try{
    setSync('☁️ GitHub kaydediliyor…');
    const snap=JSON.parse(JSON.stringify(S));
    for(const w of snap.wrong)if(w.img&&!w.up){
      await put('fotolar/'+w.id+'.jpg',w.img.split(',')[1],'Yanlış soru fotoğrafı');
      const live=S.wrong.find(x=>x.id===w.id);if(live)live.up=1;
    }
    for(const k of ['info','qset'])for(const e of snap[k])for(const p of e.pics)if(!p.up){
      if(p.v){
        if(p.big||VFAIL.has(p.id))continue;
        const bl=await idb('r','img'+p.id);if(!(bl instanceof Blob))continue;
        try{setSync('☁️ Video GitHub’a yükleniyor…');
          await put('bilgi/'+p.id+'.'+(p.ext||'mp4'),await blobB64(bl),'Bilgi köşesi videosu',180000)}
        catch(err){VFAIL.add(p.id);console.error('Video yükleme hatası:',err);toast('⚠️ Video GitHub’a yüklenemedi; bu cihazda duruyor');continue}
      }else{
      const d=IMG[p.id]||await idb('r','img'+p.id);if(!d)continue;
      await put('bilgi/'+p.id+'.jpg',d.split(',')[1],'Bilgi köşesi resmi');}
      const le=S[k].find(x=>x.id===e.id),lp=le&&le.pics.find(x=>x.id===p.id);if(lp)lp.up=1;
    }
    await put('data.json',b64(JSON.stringify({...S,wrong:S.wrong.map(({img,...x})=>x)})),'Deniz LGS verileri');
    await idb('w','state',S);
    setSync('☁️ GitHub kaydedildi');
  }catch(e){
    console.error('GitHub kayıt hatası:',e);
    await idb('w','state',S);
    setSync('⚠️ GitHub kaydı başarısız — yerel kayıt korundu');
  }finally{
    pushBusy=false;
    if(pushAgain){pushAgain=false;clearTimeout(tm);tm=setTimeout(push,700)}
  }
}

async function pull(){
  try{
    setSync('⏳ GitHub okunuyor');
    const g=await api('data.json');
    if(g.ok){
      const D=JSON.parse(unb((await g.json()).content)),old=Object.fromEntries(S.wrong.map(w=>[w.id,w.img]));
      (D.wrong=D.wrong||[]).forEach(w=>w.img=old[w.id]||null);
      S=Object.assign(DEF(),D);migrate();
      for(const w of S.wrong)if(!w.img){
        const r=await api('fotolar/'+w.id+'.jpg');
        if(r.ok)w.img='data:image/jpeg;base64,'+(await r.json()).content.replace(/\n/g,'');
      }
      await idb('w','state',S);
      setSync('☁️ GitHub ile güncel');
    }else if(g.status==404){
      await push();
    }else throw new Error('GET data.json HTTP '+g.status);
  }catch(e){
    console.error('GitHub okuma hatası:',e);
    setSync('⚠️ GitHub okunamadı — yerel veriler korunuyor');
  }
}

const sdL=e=>{const k=gunK(e.date);return `<div class="it" style="--c:${k<0?'var(--mu)':k<=3?'#dc2626':'var(--pri)'}"><div><b>${esc(e.ders)}</b> · ${esc(e.tur)}${e.time?' · '+e.time:''}<br><small>${fd(e.date)}${e.not?' · '+esc(e.not):''}</small></div><b>${k<0?'':k==0?'Bugün!':k==1?'Yarın':k+' gün'}</b>${del('sd',e)}</div>`};
const r2=x=>Math.round(x*100)/100,netOf=(d,y)=>r2((+d||0)-(+y||0)/3);
const SAY=['Matematik','Fen Bilimleri'],SOZ=['Türkçe','İnkılap Tarihi','Din Kültürü','İngilizce'],QN={'Türkçe':20,'Matematik':20,'Fen Bilimleri':20,'İnkılap Tarihi':10,'İngilizce':10,'Din Kültürü':10},TUR={genel:'Genel Deneme',sayisal:'Branş – Sayısal',sozel:'Branş – Sözel'};
const exRow=e=>`<div class="it" style="--c:var(--pri)"><div><b>${e.name?esc(e.name):TUR[e.tur]}</b> · ${fd(e.date)}<br><small>${TUR[e.tur]}${e.tur=='genel'?' · Puan '+(e.puan??'–')+' · Sayısal '+exNet(e,SAY)+' · Sözel '+exNet(e,SOZ):''} · ${Object.entries(e.r).map(([k,x])=>k+': '+netOf(x.d,x.y)).join(' · ')}</small></div><b>${e.tur=='genel'&&e.puan!=null?e.puan+' puan':exNet(e,exSet(e.tur))+' net'}</b>${del('exams',e)}</div>`;

if(d.okunabilir===false){it.st='hata';it.err='Fotoğraftaki soru okunamadı. Soruyu tam gösteren, net ve aydınlık bir fotoğraf çekip tekrar dene.';return}
const rec={id:it.id,date:today(),ders:it.ders,konu:it.konu,hash:it.hash,dogru:d.dogru_cevap,dogruMetin:d.dogru_cevap_metni,soru:d.soru_metni,siklar:d.siklar||[],adimlar:d.adimlar||[],hata:d.olasi_hata_nedeni,guven:d.guven,model:r.model||''};
S.ai.push(rec);await idb('w','aiimg'+it.id,it.img);
if(it.saveW)S.wrong.push({id:S.id++,ders:it.ders,konu:it.konu,not:'',img:it.img,ai:it.id});
AI.q=AI.q.filter(x=>x!==it);save();toast('✅ Çözüldü · doğru cevap '+rec.dogru);
if(!AI.q.length&&$('#aim').style.display!='flex')aiOpen(rec.id)}
async function aiRun(){if(AI.busy)return;AI.busy=true;AI.msg='';
try{for(;;){
if(AI.pause)break;
if(!AI.cfg.url){AI.msg='Önce Ayarlar bölümünden yapay zekâ sunucu adresini gir.';break}
const it=AI.q.find(x=>x.st=='bekliyor');if(!it)break;
const w=AI.gap-(Date.now()-AI.last);if(w>0)await sleep(w);
if(!AI.q.includes(it))continue;
it.st='çözülüyor';it.err='';aiPaintQ();AI.last=Date.now();
const r=await aiCall(it);
if(!AI.q.includes(it))continue;
if(r.ok)await aiDone(it,r);
else if(r.code=='quota'){it.st='bekliyor';const day=r.scope=='day';AI.pause={until:Date.now()+(r.retryAfter||60)*1000,msg:day?'Günlük ücretsiz yapay zekâ kotası doldu. Sıradaki sorular kaybolmadı. Kota her gün Türkiye saatiyle yaklaşık 10:00–11:00\'de yenilenir; sonra "Devam et"e bas.':'Dakikalık istek sınırına ulaşıldı. Sıradaki sorular kaybolmadı.'}}
else if(r.code=='config'||r.code=='auth'||r.code=='origin'){it.st='bekliyor';AI.msg=(r.message||'Sunucu ayarı hatalı.')+' Ayarlar bölümünü kontrol et.';break}
else if(r.code=='busy'&&++it.tries<2){it.st='bekliyor';it.err=r.message||'';await sleep(4000)}
else{it.st='hata';it.err=r.message||'Bilinmeyen hata'}
await aiSave();aiPaintQ()}}
finally{AI.busy=false;await aiSave();aiPaintQ()}}

calisma(){return `<h2>Çalışmalarım</h2><div class="card"><h3>Yeni çalışma</h3><div class="row"><input id="wdt" type="date" value="${today()}">${dk('w')}<label>Soru <input id="wq" type="number" min="1" value="20" style="width:80px"></label><label>Süre (dk) <input id="wm" type="number" min="1" value="30" style="width:80px"></label><button class="b" data-act="addw">Çalışmayı ekle</button></div></div>
<div class="card">${S.work.slice().sort((a,b)=>a.date<b.date?1:-1).map(wL).join('')||none('Henüz çalışma yok.')}</div>`},
eksik(){const t=today(),h=S.hw.filter(x=>!x.done&&x.due<t),w=S.work.filter(x=>!x.done&&x.date<t);
return `<h2>Eksikler</h2><div class="card"><h3>Tamamlanmamış ödevler (${h.length})</h3>${h.map(hwL).join('')||none('Eksik ödev yok, harika!')}</div><div class="card"><h3>Tamamlanmamış çalışmalar (${w.length})</h3>${w.map(wL).join('')||none('Eksik çalışma yok, harika!')}</div>`},
ayar(){const g=GH||{};return `<h2>Ayarlar</h2><div class="card"><h3>Profil</h3><div class="row"><input id="pn" value="${esc(S.name)}" placeholder="Adın"><label>LGS tarihi <input id="pl" type="date" value="${S.lgs||''}"></label><button class="b" data-act="savep">Kaydet</button></div></div><div class="card"><h3>GitHub'a kaydetme</h3><p class="mu">Veriler depoda <b>data.json</b> olarak, yanlış soru fotoğrafları <b>fotolar/</b> klasöründe saklanır. Bağlanınca depoda veri varsa o yüklenir. Jeton (token) yalnızca bu tarayıcıda durur. Verileri sayfanın durduğu depodan ayrı, <b>özel (private)</b> bir depoda tut. Jeton: GitHub → Settings → Developer settings → Fine-grained tokens → sadece bu depo, Contents: Read and write.</p><div class="row"><input id="gho" placeholder="Kullanıcı adı" value="${esc(g.o)}"><input id="ghr" placeholder="Depo adı" value="${esc(g.r)}"><input id="ghb" placeholder="Dal" value="${esc(g.b||'main')}"><input id="ght" type="password" placeholder="Jeton" value="${esc(g.t)}"><button class="b" data-act="ghsave">Bağlan ve kaydet</button><button class="b" data-act="ghoff" style="background:var(--mu)">Bağlantıyı kaldır</button></div><p>${esc(sync)||'Bağlı değil: veriler yalnızca bu tarayıcıda.'}</p></div>${aiSet()}`},
yanlis(){const l=S.wrong.filter(w=>(!wf.d||w.ders==wf.d)&&(!wf.k||w.konu==wf.k));
const g=Object.keys(DERS).map(d=>{const a=l.filter(w=>w.ders==d);if(!a.length)return'';return `<div class="card"><h3>${d}</h3>`+[...new Set(a.map(w=>w.konu))].map(k=>`<h4>${esc(k)}</h4><div class="imgs">`+a.filter(w=>w.konu==k).map(w=>`<div class="ph"><img src="${w.img||''}" data-act="zoom"><small>${esc(w.not)}</small>${w.ai?`<button class="b" style="width:100%;margin-top:4px" data-ai="open" data-id="${w.ai}">🤖 Çözümü gör</button>`:''}${del('wrong',w)}</div>`).join('')+'</div>').join('')+'</div>'}).join('');
return `<h2>Yanlışlarım</h2>${aiCard()}<div class="card"><h3>Yanlış soru ekle</h3><div class="row">${dk('y')}<input id="yn" placeholder="Not (isteğe bağlı)"><input id="yf" type="file" accept="image/*" multiple><button class="b" data-act="addy">Fotoğrafı kaydet</button></div></div>
<div class="card row"><b>Filtre:</b><select id="fd"><option value="">Tüm dersler</option>${dO(wf.d)}</select><select id="fk"><option value="">Tüm konular</option>${wf.d?kO(wf.d,wf.k):''}</select><button class="b" data-act="wdoc">📄 Word olarak indir</button></div>${g||none('Gösterilecek yanlış soru yok.')}`}};
function render(){{const tp=$('#tip');if(tp)tp.style.display='none'}if(view=='msg'){NEW=new Set(unread().map(m=>m.id));markSeen()}const un=unread().length;$('#nav').innerHTML=MENU.map(m=>`<button class="${m[0]==view?'on':''}" data-act="go" data-n="${m[0]}">${m[1]}${m[0]=='msg'&&un?'<span class="dot">'+un+'</span>':''}</button>`).join('');$('#app').innerHTML=V[view]();$('#xp').textContent='⭐ '+totXp()+' XP';setSync(sync);if(view=='soru'){document.querySelectorAll('#app .scroll').forEach(sc=>{const i=sc.querySelector('i.cur,.stk.cur');if(i)sc.scrollLeft=Math.max(0,i.getBoundingClientRect().left-sc.getBoundingClientRect().left+sc.scrollLeft-100)});fw()}}
const rd=f=>new Promise(r=>{const o=new FileReader();o.onload=()=>r(o.result);o.readAsDataURL(f)});
const sq=f=>new Promise(async r=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*.2,m,m,0,0,320,320);r(c.toDataURL('image/jpeg',.85))};im.src=await rd(f)});
const comp=async f=>new Promise(async r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=await rd(f)});
document.addEventListener('change',async e=>{const t=e.target,m=t.id&&t.id.match(/^(hw|w|y)d$/);
if(t.id=='hwt'){const d=$('#hwd'),c=d.value;d.innerHTML=(t.value=='okul'?ALL():Object.keys(DERS)).map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('');$('#hwk').innerHTML=kO(d.value);return}
if(m){$('#'+m[1]+'k').innerHTML=kO(t.value);return}
if(t.dataset.addpics){const[k,id]=t.dataset.addpics.split(':'),e=S[k].find(o=>o.id==id);for(const f of t.files){const pc=await addMedia(f);if(pc)e.pics.push(pc);if(pc&&pc.big)alert('25 MB üzerindeki video yalnızca bu cihazda saklanır, GitHub’a yüklenmez.')}SL[e.id]=e.pics.length-1;save();render();return}if(t.id=='who'){WHO=t.value;idb('w','who',WHO);render();return}if(t.id=='avf'){const fl=t.files[0];if(!fl)return;S.avatar=await sq(fl);save();render();toast('Fotoğrafın eklendi 📸');return}if(t.id=='qm'){qmon=t.value;render();return}if(t.id=='et'){examT=t.value;render();return}if(t.id=='fd'){wf={d:t.value,k:''};render();return}if(t.id=='fk'){wf.k=t.value;render();return}
if(t.dataset.t){const L=lvl()[0],x=S[t.dataset.t].find(o=>o.id==t.dataset.id);x.done=t.checked;x.dd=t.checked?today():null;save();render();if(t.checked)toast(lvl()[0]>L?'🎊 Seviye atladın!':'+10 XP kazandın! 🎉')}});
function place(t,id,ds,h){const x=S[t].find(o=>o.id==id);x.pl=x.pl||{};if(h=='x')delete x.pl[ds];else x.pl[ds]=+h;save();render()}
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('[data-tip]'),t=$('#tip');if(!c){t.style.display='none';return}t.textContent=c.dataset.tip;t.style.borderLeft='4px solid '+c.dataset.c;t.style.display='block'});
document.addEventListener('mousemove',e=>{const t=$('#tip');if(t.style.display=='block'){t.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-t.offsetWidth-8))+'px';t.style.top=Math.max(4,e.clientY-t.offsetHeight-12)+'px'}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-dt]');if(c)e.dataTransfer.setData('text/plain',[c.dataset.dt,c.dataset.id,c.dataset.ds].join('|'))});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
document.addEventListener('drop',e=>{const sl=e.target.closest&&e.target.closest('.slot');if(!sl)return;e.preventDefault();const[t,id,ds]=e.dataTransfer.getData('text/plain').split('|');if(!t)return;if(sl.dataset.ds!=ds){alert('Ödev ya da çalışma yalnızca kendi gününe yerleştirilebilir.');return}place(t,id,ds,sl.dataset.h)});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,n=b.dataset.n;
if(a=='plc'){const r=prompt('Saat kaç? (8-23 arası, 00:00 için 24; kaldırmak için boş bırak)');if(r===null)return;place(b.dataset.t,b.dataset.id,n,r.trim()===''?'x':Math.min(24,Math.max(8,+r||8)));return}else if(a=='wdoc'){await wdoc();return}
else if(a=='avp'){$('#avf').click();return}else if(a=='avx'){S.avatar='';save()}
else if(a=='addmsg'){const tx=v('mt').trim();if(!tx)return;const mid=S.id++;if(v('mf')!=WHO)HOLD.add(mid);S.msgs.push({id:mid,from:v('mf'),text:tx,ts:new Date().toISOString()});save()}
else if(a=='addsd'){if(!v('xd')){alert('Sınav tarihini seç.');return}S.sd.push({id:S.id++,date:v('xd'),time:v('xh'),ders:v('xk'),tur:v('xt'),not:v('xn').trim()});save()}
else if(a=='addn'){const p=+v('np');if(!v('np')||p<0||p>100){alert('Puanı 0-100 arasında gir.');return}S.notes.push({id:S.id++,date:v('nd'),ders:v('nk'),tur:v('nt'),puan:p});save()}
else if(a=='addq'){const k=+v('qn');if(!(k>0))return;S.qs.push({id:S.id++,date:v('qd'),ders:v('qk'),n:k});save()}
else if(a=='savegoal'){S.goal=+v('gl')||300;save()}
else if(a=='savep'){S.name=v('pn').trim()||'Deniz';S.lgs=v('pl');save()}
else if(a=='addex'){const r={};exSet(examT).forEach((k,i)=>r[k]={q:+v('q'+i)||0,d:+v('d'+i)||0,y:+v('y'+i)||0});for(const k in r)if(r[k].d+r[k].y>r[k].q){alert(k+': doğru + yanlış, soru sayısını aşıyor.');return}let pu;if(examT=='genel'){pu=parseFloat(v('ep'));if(!(pu>=100&&pu<=500)){alert('Genel deneme için puanı 100-500 arasında gir.');return}}S.exams.push({id:S.id++,date:v('ed'),tur:examT,name:v('en').trim(),r,puan:pu});save()}
else if(a=='go'){view=n;fwDone=false;HOLD=new Set();if(n=='takvim'){cal='hafta';ws=mondayOf(new Date())}}else if(a=='cal'){cal=n}else if(a=='wn'){ws=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7*n)}else if(a=='wk'){cal='hafta';ws=mondayOf(new Date(n+'T00:00'))}else if(a=='ghsave'){GH={o:v('gho').trim(),r:v('ghr').trim(),b:v('ghb').trim()||'main',t:v('ght').trim()};await idb('w','gh',GH);await pull()}else if(a=='push'){await push();return}
else if(a=='addpro'){const t=v('pr_t').trim();if(!t){alert('Atasözünü yaz.');return}if(v('pr_d')==today())S.plog=S.plog.filter(x=>x.date!=today());S.proverbs.push({id:S.id++,t,m:v('pr_m').trim(),e:v('pr_e').trim(),date:v('pr_d')||''});save()}
else if(a=='addword'){const k=v('wk_k').trim(),m=v('wk_m').trim(),e=v('wk_e').trim();if(!k||!m||!e){alert('Kelime, anlam ve örnek cümleyi doldur.');return}if(v('wk_d')==today())S.wlog=S.wlog.filter(x=>x.date!=today());S.words.push({id:S.id++,k,m,e,date:v('wk_d')||''});save()}
else if(a=='tgd'){const h=HID[b.dataset.t]||(HID[b.dataset.t]=new Set());h.has(n)?h.delete(n):h.add(n)}
else if(a=='sl'){const e=S[b.dataset.t].find(o=>o.id==b.dataset.id),L=e.pics.length;SL[e.id]=((SL[e.id]||0)+ +n+L)%L}
else if(a=='selk'){SEL[b.dataset.t]=+b.dataset.id;SL[+b.dataset.id]=0;if(b.dataset.t=='info'){const q=S.qset.find(x=>x.ref==b.dataset.id);if(q){SEL.qset=q.id;SL[q.id]=0}}scrollTo(0,0)}
else if(a=='addbil'){await addMod('info')}else if(a=='addqs'){await addMod('qset')}
else if(a=='delpic'){const e=S[b.dataset.t].find(o=>o.id==b.dataset.id),i=Math.min(SL[e.id]||0,e.pics.length-1);if(!e.pics.length||!confirm('Bu resim/video silinsin mi?'))return;const[p]=e.pics.splice(i,1);if(p.v&&IMG[p.id])URL.revokeObjectURL(IMG[p.id]);delete IMG[p.id];idb('w','img'+p.id,null);SL[e.id]=Math.max(0,i-1);save()}
else if(a=='renk'){const e=S[b.dataset.t].find(o=>o.id==b.dataset.id),t=prompt('Yeni başlık',e.title);if(!t||!t.trim())return;e.title=t.trim();save()}else if(a=='ghoff'){GH=null;await idb('w','gh',null);setSync('')}else if(a=='mo'){mon=new Date(mon.getFullYear(),mon.getMonth()+ +n,1)}else if(a=='flt'){flt=n}
else if(a=='zoom'){$('#lb img').src=b.src;$('#lb').style.display='flex';return}
else if(a=='del'){if(!confirm('Silinsin mi?'))return;const t=b.dataset.t;S[t]=S[t].filter(o=>o.id!=b.dataset.id);save()}
else if(a=='addsc'){if(!v('scd').trim())return;S.sched.push({id:S.id++,day:+v('scg'),time:v('sct'),ders:v('scd').trim(),type:v('scy')});save()}
else if(a=='addhw'){if(!v('hwdue')){alert('Son tarihi seç.');return}S.hw.push({id:S.id++,type:v('hwt'),ders:v('hwd'),konu:v('hwk'),desc:v('hwx'),due:v('hwdue'),cr:v('hwdue')<today()?v('hwdue'):today(),done:false,dd:null});save()}
else if(a=='addw'){if(!v('wdt'))return;S.work.push({id:S.id++,date:v('wdt'),ders:v('wd'),konu:v('wk'),q:+v('wq')||0,min:+v('wm')||0,done:false,dd:null});save()}
else if(a=='addy'){const fs=[...$('#yf').files];if(!fs.length){alert('Önce fotoğraf seç.');return}for(const f of fs)S.wrong.push({id:S.id++,ders:v('yd'),konu:v('yk'),not:v('yn'),img:await comp(f)});save()}
render()});
$('#lb').onclick=()=>$('#lb').style.display='none';
load().then(render);
</script></body></html>
